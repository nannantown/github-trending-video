name: Daily Trending Video
# On-time runs are started by the posting clock (sns-hub clock/, a Cloudflare cron) with clock=true;
# the title marks them so the late `schedule` backup can see one already started.
run-name: ${{ inputs.clock && format('{0} (on time)', github.workflow) || github.workflow }}

on:
  schedule:
    # Posts at 08:00 JST (23:00 UTC), started by the posting clock; 23:31 UTC = 08:31 JST backup
    - cron: "31 23 * * *" # late backup only — the on-time start is the posting clock (sns-hub clock/, 08:00 JST)
  workflow_dispatch:
    inputs:
      clock:
        description: "Started by the posting clock (sns-hub clock/). Leave off for manual runs"
        type: boolean
        default: false
      dry_run:
        description: "Verify mode: render both videos (shared + YouTube variant) and upload them as artifacts, without posting or committing"
        type: boolean
        default: false
  push:
    paths:
      - '.recovery-trigger'

permissions:
  contents: write

# Shared with the manual retry: never cancel a post already in progress.
concurrency:
  group: sns-posting
  queue: max
  cancel-in-progress: false

jobs:
  # GitHub starts `schedule` runs hours late at busy times (2026-11-01: 2–3 h), so the posting
  # clock starts this workflow on time and the cron above is only a backup, set 30+ min after
  # the clock. The backup must not post a second time (coffee / figma would post YouTube twice):
  # it stops here when an on-time run started in the last 12 hours, whatever that run's result
  # (a failed Instagram is re-posted by the retry workflow, never by a second daily run).
  backup-gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/daily-video.yml/runs" \
            -f event=workflow_dispatch -f branch=main -f created=">=$since" -F per_page=100 \
            --jq '[.workflow_runs[] | select(.display_title | endswith(" (on time)"))] | length')
          echo "on-time runs since $since: $n"
          if [ "$n" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::The posting clock already started today's run on time — this late backup does nothing."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No on-time run in the last 12 hours — the posting clock missed it, so this backup posts."
          fi

  generate-video:
    needs: backup-gate
    # Runs when the gate was skipped (not a schedule run) or said go; a failed gate posts nothing.
    if: ${{ !cancelled() && (needs.backup-gate.result == 'skipped' || needs.backup-gate.outputs.skip == 'false') }}
    runs-on: ubuntu-latest
    # 20 (was 15): the pipeline now also renders the YouTube-only video
    # (~2 min). scripts/pipeline.mjs time-boxes that step against this value
    # (YOUTUBE_VARIANT_DEADLINE_MS) so the Instagram post always fits — keep in sync.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Fonts + ffmpeg still come from apt (same packages, same versions, so the
      # video looks the same), but the downloaded .deb files (~300 MB) are kept in
      # actions/cache. On 2026-10-23 and 10-27 the Ubuntu mirror served them at
      # ~60 kB/s and this install ran into the job timeout, which GitHub reports
      # as "cancelled" (not red), so the day's post vanished silently. Now a normal
      # day downloads nothing, and a slow mirror fails the install step red within
      # ~5 minutes instead of eating the whole job. Notes:
      # sns-hub docs/operations/2026-10-27-apt-timeout.md
      - name: Resolve apt packages (fonts + ffmpeg)
        id: apt
        timeout-minutes: 2
        run: |
          timeout 60 sudo apt-get update
          # Cache key = hash of the exact .deb files apt would fetch: a package
          # update gives a new key (the old cache is restored, only the new .deb
          # is downloaded, then the new set is saved).
          uris=$(sudo apt-get install --print-uris -qq fonts-noto-cjk fonts-noto-cjk-extra ffmpeg)
          prefix="apt-debs-${ImageOS:-unknown}-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}$(printf '%s' "$uris" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # A slow or failed restore must not eat the job: carry on and download.
      - name: Restore apt .deb cache
        id: apt-cache
        timeout-minutes: 3
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ~/apt-debs/*.deb
          key: ${{ steps.apt.outputs.key }}
          restore-keys: ${{ steps.apt.outputs.prefix }}

      - name: Install Japanese fonts + ffmpeg
        id: install
        timeout-minutes: 6
        run: |
          mkdir -p ~/apt-debs/partial
          apt_opts=(-o Dir::Cache::Archives="$HOME/apt-debs" -o Acquire::Retries=3)
          pkgs=(fonts-noto-cjk fonts-noto-cjk-extra ffmpeg)
          # Only the download is time-limited and retried (killing it leaves no
          # half-installed packages; finished .deb files are kept for attempt 2).
          for attempt in 1 2; do
            if timeout 120 sudo apt-get install --download-only -y "${apt_opts[@]}" "${pkgs[@]}"; then
              break
            fi
            if [ "$attempt" = 2 ]; then
              echo "::error::apt could not download fonts + ffmpeg in time (slow Ubuntu mirror?). Failing red instead of running into the job timeout."
              exit 1
            fi
            echo "::warning::apt download attempt $attempt timed out or failed; retrying (finished .deb files are kept)"
          done
          # Install once from the cache only, never touching the network.
          sudo apt-get install -y --no-download "${apt_opts[@]}" "${pkgs[@]}"
          # Drop superseded versions so the cache does not grow forever.
          sudo apt-get "${apt_opts[@]}" autoclean
          fc-cache -fv
          ffmpeg -version | head -1

      # Saved even when the install failed (under a one-off "partial" key), so
      # the .deb files that did arrive are not downloaded again next time.
      - name: Save apt .deb cache
        if: always() && steps.apt.outcome == 'success' && steps.apt-cache.outputs.cache-hit != 'true'
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ~/apt-debs/*.deb
          key: ${{ steps.install.outcome == 'success' && steps.apt.outputs.key || format('{0}partial-{1}-{2}', steps.apt.outputs.prefix, github.run_id, github.run_attempt) }}

      - name: Install dependencies
        run: npm ci

      - name: Require main for live posting
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: |
          echo "Live posting requires main; use dry_run for branch verification."
          exit 1

      - name: Run pipeline
        run: node scripts/pipeline.mjs
        env:
          TZ: Asia/Tokyo
          # inputs.dry_run is '' on schedule/push runs (falsy) → the secret is used as before.
          SNS_POST_ENABLED: ${{ inputs.dry_run && 'false' || secrets.SNS_POST_ENABLED }}
          # YouTube
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # 2026-09-14 YouTube distribution experiment (YouTube upload only) —
          # kill switches via repo Variables (Settings > Secrets and variables >
          # Actions > Variables). Unset = experiment on; "false" (or "standard",
          # or any unrecognized value) = pre-experiment behaviour.
          # See scripts/yt-experiment-switches.mjs.
          YT_TITLE_TEMPLATE: ${{ vars.YT_TITLE_TEMPLATE }}
          YT_OPENING_HOOK: ${{ vars.YT_OPENING_HOOK }}
          YT_SET_THUMBNAIL: ${{ vars.YT_SET_THUMBNAIL }}
          # Instagram
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          # GitHub (auto-provided, used for Release creation)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit performance history
        if: ${{ always() && !inputs.dry_run && github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/performance-history.json
          if [ -d data/posting ]; then git add data/posting; fi
          git diff --staged --quiet || git commit -m "Update performance history [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trending-video-${{ github.run_number }}
          path: |
            output/trending-*.mp4
            output/trending-*-cover.jpg
            output/trending-*-metadata.json
            data/posting/*.json
            data/performance-history.json
          retention-days: 30
