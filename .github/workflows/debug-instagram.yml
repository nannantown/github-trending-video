name: Debug Instagram Token

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect token and account
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
        run: |
          set +e
          redact() { sed -E 's/(access_token|client_secret|id=)[^&"]+/\1REDACTED/g; s/(EAA[A-Za-z0-9_-]{8})[A-Za-z0-9_-]+/\1...REDACTED/g'; }

          echo "=== 1. debug_token (scopes & app info) ==="
          APP_TOKEN="${FACEBOOK_APP_ID}|${FACEBOOK_APP_SECRET}"
          curl -sG "https://graph.facebook.com/v22.0/debug_token" \
            --data-urlencode "input_token=${INSTAGRAM_ACCESS_TOKEN}" \
            --data-urlencode "access_token=${APP_TOKEN}" \
            | jq . | redact
          echo

          echo "=== 2. /me (who is this token for) ==="
          curl -sG "https://graph.facebook.com/v22.0/me" \
            --data-urlencode "fields=id,name" \
            --data-urlencode "access_token=${INSTAGRAM_ACCESS_TOKEN}" \
            | jq . | redact
          echo

          echo "=== 3. /me/accounts (linked FB pages) ==="
          curl -sG "https://graph.facebook.com/v22.0/me/accounts" \
            --data-urlencode "fields=id,name,instagram_business_account{id,username}" \
            --data-urlencode "access_token=${INSTAGRAM_ACCESS_TOKEN}" \
            | jq . | redact
          echo

          echo "=== 4. IG account info ==="
          curl -sG "https://graph.facebook.com/v22.0/${INSTAGRAM_USER_ID}" \
            --data-urlencode "fields=id,username,account_type,media_count" \
            --data-urlencode "access_token=${INSTAGRAM_ACCESS_TOKEN}" \
            | jq . | redact
          echo

          echo "=== 5. Try container creation (Reels) ==="
          # Public sample Reels-ready mp4 from GH release
          VIDEO_URL="https://github.com/nannantown/github-trending-video/releases/download/v20260417/trending-20260417.mp4"
          curl -s -X POST "https://graph.facebook.com/v22.0/${INSTAGRAM_USER_ID}/media" \
            -H "Content-Type: application/json" \
            -d "{\"media_type\":\"REELS\",\"video_url\":\"${VIDEO_URL}\",\"caption\":\"debug test\",\"access_token\":\"${INSTAGRAM_ACCESS_TOKEN}\"}" \
            | jq . | redact
          echo

          echo "=== Done ==="
