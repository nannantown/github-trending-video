name: Refresh Instagram Token

on:
  schedule:
    # 毎週日曜 UTC 0:00（JST 9:00）に実行
    # 60日で失効する long-lived token を週次で延長（最大でも15日以内には触る）
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh token
        run: |
          # A Meta Business "system user" token generated with expiry "Never"
          # has nothing to extend: fb_exchange_token is the 60-day user-token
          # flow, so skip it and stay green. Any other token (or a failed
          # check) falls through to the exchange below, unchanged — the step
          # runs under `bash -e`, so the check itself must never abort it.
          # Only non-secret fields of debug_token are printed.
          DEBUG=$(curl -s -G "https://graph.facebook.com/v22.0/debug_token" \
            --data-urlencode "input_token=${INSTAGRAM_ACCESS_TOKEN}" \
            --data-urlencode "access_token=${FACEBOOK_APP_ID}|${FACEBOOK_APP_SECRET}" || true)
          echo "$DEBUG" | jq '{type: .data.type, is_valid: .data.is_valid, expires_at: .data.expires_at, data_access_expires_at: .data.data_access_expires_at, scopes: .data.scopes, error: (.error.message // .data.error.message)}' || true
          # expires_at 0 (or absent) on a valid token = no time limit. Meta's
          # debug_token reference does not spell this out, so it is printed above.
          if [ "$(echo "$DEBUG" | jq -r '.data.is_valid')" = "true" ] && [ "$(echo "$DEBUG" | jq -r '.data.expires_at // 0')" = "0" ]; then
            echo "Token never expires (type: $(echo "$DEBUG" | jq -r '.data.type')) — nothing to refresh."
            exit 0
          fi

          RESPONSE=$(curl -s "https://graph.facebook.com/v22.0/oauth/access_token?\
          grant_type=fb_exchange_token&\
          client_id=${FACEBOOK_APP_ID}&\
          client_secret=${FACEBOOK_APP_SECRET}&\
          fb_exchange_token=${INSTAGRAM_ACCESS_TOKEN}")

          NEW_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          EXPIRES_IN=$(echo "$RESPONSE" | jq -r '.expires_in')

          if [ "$NEW_TOKEN" != "null" ] && [ -n "$NEW_TOKEN" ]; then
            echo "Token refreshed successfully"
            echo "Expires in: ${EXPIRES_IN} seconds ($(( EXPIRES_IN / 86400 )) days)"
            # NOTE: the default GITHUB_TOKEN cannot write to Actions secrets
            # (403: Resource not accessible by integration). A Fine-grained
            # PAT with Secrets: Read and write on this repository must be
            # stored as the GH_PAT secret.
            gh secret set INSTAGRAM_ACCESS_TOKEN --body "$NEW_TOKEN"
          else
            echo "Token refresh failed:"
            echo "$RESPONSE" | jq .
            exit 1
          fi
        env:
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
