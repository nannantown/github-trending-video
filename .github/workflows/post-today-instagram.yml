name: Retry Instagram for Date

# Re-post a day's Reel to Instagram only, from the exact video + metadata the
# daily run archived in Release v<YYYYMMDD> and pinned in its posting journal
# (data/posting/<date>.json). Nothing is re-rendered or regenerated, YouTube is
# never touched, and only a proven pre-publication failure is retried
# (scripts/posting-state.mjs assertRetryable).
#
# Automatic (owner order 2026-10-27): four slots look again the same day —
# 12:07 / 14:07 / 17:07 / 20:07 JST. GitHub starts the 08:00 run late
# (10/20–10/27: 09:35–10:40 JST), so the slots sit after that. A slot posts only
# when the day's record has YouTube and no Instagram, daily-video.yml finished
# 45+ min ago (scripts/ig-auto-retry.mjs gate), the video fits a Reel and the
# account does not show the day yet (… check). At most 3 automatic uploads per
# day, and none after 2 ProcessingFailedErrors in a row (data/ig-auto-retry.json).
# A failure an earlier slot can leave to the next is a note (the job has
# continue-on-error); the last slot's failure is red, and so is anything no
# later slot can fix (too long, another post on the account, a journal that is
# not a proven pre-publication failure, the day's tries spent) — at once.
#
# Switches (repo Variables, scheduled runs only): IG_AUTO_RETRY=off stops all
# automatic retries; IG_AUTO_RETRY_SKIP=20261026,20261023 leaves those days alone.
#
# By hand: gh workflow run post-today-instagram.yml -f date=YYYY-MM-DD -f platform=instagram

on:
  schedule:
    - cron: "7 3 * * *" # 12:07 JST
    - cron: "7 5 * * *" # 14:07 JST
    - cron: "7 8 * * *" # 17:07 JST
    - cron: "7 11 * * *" # 20:07 JST — the last slot: a failure here is red
  workflow_dispatch:
    inputs:
      date:
        description: "Failed posting date (YYYY-MM-DD), with a new posting journal and saved metadata"
        type: string
        required: true
      platform:
        description: "Explicit retry destination"
        type: choice
        options:
          - instagram
        required: true

permissions:
  contents: write
  actions: read # the gate lists daily-video.yml runs (unlisted scopes are none → 403)

# The same lock as daily-video.yml: a retry and a daily post never run at once.
concurrency:
  group: sns-posting
  queue: max
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # An earlier slot's failure is a note — the next slot tries again. The last slot (and a hand-run) goes red.
    continue-on-error: ${{ github.event_name == 'schedule' && github.event.schedule != '7 11 * * *' }}
    outputs:
      stop: ${{ steps.gate.outputs.stop }}${{ steps.check.outputs.stop }}${{ steps.journal.outputs.stop }}${{ steps.bundle.outputs.stop }}${{ steps.mark.outputs.stop }}
    steps:
      - name: Require main and explicit destination
        env:
          RETRY_DATE: ${{ inputs.date }}
          RETRY_PLATFORM: ${{ inputs.platform }}
          EVENT: ${{ github.event_name }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          if [ "$EVENT" = schedule ]; then exit 0; fi
          test "$RETRY_PLATFORM" = "instagram"
          [[ "$RETRY_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]

      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Is this an Instagram-only failure? (record has YouTube, no Instagram)
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_DATE: ${{ inputs.date }}
          IG_AUTO_RETRY: ${{ vars.IG_AUTO_RETRY }}
          IG_AUTO_RETRY_SKIP: ${{ vars.IG_AUTO_RETRY_SKIP }}
        run: node scripts/ig-auto-retry.mjs gate --records=data/performance-history.json --post-time=08:00 --last-slot="7 11 * * *" ${INPUT_DATE:+"--date=${INPUT_DATE//-/}"}

      - name: Download exact saved video and metadata
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          compact: ${{ steps.gate.outputs.stamp }}
        run: |
          mkdir -p output
          gh release download "v${compact}" -p "trending-${compact}.mp4" -D output/
          gh release download "v${compact}" -p "trending-${compact}-metadata.json" -D output/

      - name: Fits a Reel, and not on Instagram yet?
        id: check
        if: steps.gate.outputs.go == 'true'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          compact: ${{ steps.gate.outputs.stamp }}
        run: node scripts/ig-auto-retry.mjs check --file="output/trending-${compact}.mp4" --captions="output/trending-${compact}-metadata.json" --stamp="$compact" --post-time=08:00

      # Before the journal check: a publish whose reply was lost leaves the
      # journal "unknown" — if the account shows the day, record it.
      - name: Already on Instagram — record it in the journal
        if: steps.check.outputs.posted == 'true'
        env:
          RETRY_DATE: ${{ steps.gate.outputs.date }}
          MEDIA_ID: ${{ steps.check.outputs.mediaId }}
        run: node scripts/retry-instagram.mjs --date="$RETRY_DATE" --platform=instagram --record-media-id="$MEDIA_ID"

      # The retry transport uses only Node built-ins; no rendering dependencies.
      # Both checks read only main's journal and the downloaded bundle: a failure
      # here is not something a later slot can fix (stop → red at once).
      - name: Validate calendar date and existing journal
        id: journal
        if: steps.gate.outputs.go == 'true' && steps.check.outputs.posted == 'false'
        env:
          RETRY_DATE: ${{ steps.gate.outputs.date }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { validateDate, loadState, assertRetryable } from './scripts/posting-state.mjs';
          try {
            const date = validateDate(process.env.RETRY_DATE);
            assertRetryable(loadState(process.cwd(), date), 'instagram',
              JSON.parse(readFileSync('data/performance-history.json', 'utf8')));
          } catch (error) {
            appendFileSync(process.env.GITHUB_OUTPUT, `stop=journal: ${error.message} — a person checks the account (docs/instagram-retry.md)\n`);
            throw error;
          }
          JS

      - name: Check bundle before credentials are used
        id: bundle
        if: steps.gate.outputs.go == 'true' && steps.check.outputs.posted == 'false'
        env:
          RETRY_DATE: ${{ steps.gate.outputs.date }}
        run: |
          node scripts/retry-instagram.mjs --date="$RETRY_DATE" --platform=instagram --check || {
            echo "stop=the saved video/metadata does not match the ${RETRY_DATE} journal — not posting" >> "$GITHUB_OUTPUT"
            exit 1
          }

      - name: Count this automatic attempt (before the upload — a crash still counts)
        if: github.event_name == 'schedule' && steps.check.outputs.posted == 'false'
        run: node scripts/ig-auto-retry.mjs mark --stamp="${{ steps.gate.outputs.stamp }}"

      - name: Retry only Instagram
        id: upload
        if: steps.gate.outputs.go == 'true' && steps.check.outputs.posted == 'false'
        env:
          RETRY_DATE: ${{ steps.gate.outputs.date }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          set -o pipefail
          node scripts/retry-instagram.mjs --date="$RETRY_DATE" --platform=instagram 2>&1 | tee output/ig-upload.log

      - name: Remember why it failed (2 ProcessingFailedErrors in a row stop the day)
        id: mark
        if: failure() && steps.upload.outcome == 'failure' && github.event_name == 'schedule'
        run: node scripts/ig-auto-retry.mjs mark --stamp="${{ steps.gate.outputs.stamp }}" --log=output/ig-upload.log

      - name: Preserve posting evidence even on failure
        if: always() && steps.gate.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: instagram-retry-${{ github.run_id }}
          path: |
            data/posting/*.json
            data/performance-history.json
            data/ig-auto-retry.json
            output/trending-*-metadata.json
            output/ig-upload.log
          retention-days: 30

      - name: Not on Instagram yet — a later slot tries again
        if: failure() && github.event_name == 'schedule' && github.event.schedule != '7 11 * * *'
        run: echo "::warning title=Instagram retry::not on Instagram yet (see the failed step above); a later slot tries the same video unless the day's tries are spent"

  # Red at once, on any slot: no later slot can fix these (too long, another
  # post on the account, the journal, the day's automatic tries spent).
  needs-a-person:
    needs: post
    if: always() && needs.post.outputs.stop != ''
    runs-on: ubuntu-latest
    steps:
      - env:
          STOP: ${{ needs.post.outputs.stop }}
        run: |
          echo "::error title=Instagram retry stopped::$STOP"
          exit 1
