name: Post Today to Instagram

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date tag (YYYYMMDD). Defaults to today JST."
        required: false
        default: ""

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve date
        id: date
        env:
          TZ: Asia/Tokyo
        run: |
          DATE="${{ inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(date +%Y%m%d)
          fi
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "Using date: $DATE"

      - name: Download video from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p output
          DATE="${{ steps.date.outputs.date }}"
          gh release download "v${DATE}" -p "trending-${DATE}.mp4" -D output/

      - name: Prepare trending data + captions
        env:
          TZ: Asia/Tokyo
        run: |
          # generate-caption.mjs reads output/trending-data.json, which is produced
          # by generate-data.mjs from data/enriched-trending.json.
          node scripts/generate-data.mjs
          node scripts/generate-caption.mjs

      - name: Upload to Instagram
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: |
          DATE="${{ steps.date.outputs.date }}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${DATE}/trending-${DATE}.mp4"
          node scripts/upload-instagram.mjs --url="$URL"
