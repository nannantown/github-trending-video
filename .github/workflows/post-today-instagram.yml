name: Retry Instagram for Date

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Failed posting date (YYYY-MM-DD), with a new posting journal and saved metadata"
        type: string
        required: true
      platform:
        description: "Explicit retry destination"
        type: choice
        options:
          - instagram
        required: true

permissions:
  contents: write

concurrency:
  group: sns-posting
  queue: max
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require main and explicit destination
        env:
          RETRY_DATE: ${{ inputs.date }}
          RETRY_PLATFORM: ${{ inputs.platform }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$RETRY_PLATFORM" = "instagram"
          [[ "$RETRY_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]

      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The retry transport uses only Node built-ins; no rendering dependencies.
      - name: Validate calendar date and existing journal
        env:
          RETRY_DATE: ${{ inputs.date }}
          RETRY_PLATFORM: ${{ inputs.platform }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { validateDate, loadState, assertRetryable } from './scripts/posting-state.mjs';
          const date = validateDate(process.env.RETRY_DATE);
          assertRetryable(loadState(process.cwd(), date), process.env.RETRY_PLATFORM,
            JSON.parse(readFileSync('data/performance-history.json', 'utf8')));
          JS

      - name: Download exact saved video and metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETRY_DATE: ${{ inputs.date }}
        run: |
          mkdir -p output
          compact=${RETRY_DATE//-/}
          gh release download "v${compact}" -p "trending-${compact}.mp4" -D output/
          gh release download "v${compact}" -p "trending-${compact}-metadata.json" -D output/

      - name: Check bundle before credentials are used
        env:
          RETRY_DATE: ${{ inputs.date }}
          RETRY_PLATFORM: ${{ inputs.platform }}
        run: node scripts/retry-instagram.mjs --date="$RETRY_DATE" --platform="$RETRY_PLATFORM" --check

      - name: Retry only Instagram
        env:
          RETRY_DATE: ${{ inputs.date }}
          RETRY_PLATFORM: ${{ inputs.platform }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: node scripts/retry-instagram.mjs --date="$RETRY_DATE" --platform="$RETRY_PLATFORM"

      - name: Preserve posting evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-retry-${{ github.run_id }}
          path: |
            data/posting/*.json
            data/performance-history.json
            output/trending-*-metadata.json
          retention-days: 30
